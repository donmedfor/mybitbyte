<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBitByte – Terminal</title>
    <style>
        /* ============================================
           HACKER / MATRIX TERMINAL
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .terminal-window {
            max-width: 900px;
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #00ff41;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.15);
            padding: 1.5rem 1.8rem;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        /* Terminal header (like real terminal tabs) */
        .terminal-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(0, 255, 65, 0.2);
            margin-bottom: 1rem;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-red {
            background: #ff5f56;
        }
        .dot-yellow {
            background: #ffbd2e;
        }
        .dot-green {
            background: #27c93f;
        }

        .terminal-title {
            color: rgba(0, 255, 65, 0.5);
            font-size: 0.8rem;
            margin-left: 0.8rem;
            letter-spacing: 1px;
        }

        /* Output area */
        #output {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 0.5rem;
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 500px;
        }

        #output .prompt {
            color: #00ff41;
        }

        #output .command {
            color: #69f0ae;
        }

        #output .output {
            color: #b9f6ca;
        }

        #output .error {
            color: #ff1744;
        }

        #output .highlight {
            color: #ffea00;
        }

        /* Input line */
        .input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(0, 255, 65, 0.1);
            padding-top: 0.8rem;
            margin-top: 0.3rem;
        }

        .input-line .prompt-symbol {
            color: #00ff41;
            font-weight: bold;
            margin-right: 0.6rem;
            white-space: nowrap;
        }

        #command-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            caret-color: #00ff41;
        }

        #command-input::selection {
            background: #00ff41;
            color: #000;
        }

        /* Scrollbar */
        #output::-webkit-scrollbar {
            width: 6px;
        }
        #output::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        #output::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .terminal-window {
                padding: 1rem;
            }
            #output {
                font-size: 0.8rem;
                max-height: 350px;
            }
            #command-input {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="terminal-window">

        <!-- Terminal header with dots -->
        <div class="terminal-header">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span class="terminal-title">root@mybitbyte:~/terminal</span>
        </div>

        <!-- Output area -->
        <div id="output">
            <span class="prompt">root@mybitbyte:~$</span>
            <span class="command"> whoami</span><br />
            <span class="output">Cybersecurity Engineer | Penetration Tester</span><br />
            <span class="prompt">root@mybitbyte:~$</span>
            <span class="command"> ls</span><br />
            <span class="output">about.md  projects/  resources/  README.md</span><br />
            <span class="prompt">root@mybitbyte:~$</span>
            <span class="command"> <span style="color:#00ff41;">█</span></span>
        </div>

        <!-- Input line -->
        <div class="input-line">
            <span class="prompt-symbol">root@mybitbyte:~$</span>
            <input type="text" id="command-input" autofocus spellcheck="false" autocomplete="off" />
        </div>

    </div>

    <script>
        // ============================================
        // INTERACTIVE TERMINAL ENGINE
        // ============================================

        const output = document.getElementById('output');
        const input = document.getElementById('command-input');

        // ── Command history (up/down arrows) ──
        let history = [];
        let historyIndex = -1;

        // ── Available commands ──
        const commands = {

            help: () => {
                return `
        Available commands:
          help      Show this help
          whoami    Display user info
          ls        List directory contents
          date      Show current date & time
          echo      Print a message (usage: echo "hello")
          clear     Clear the terminal
          matrix    🟢 Show the Matrix quote
          hack      💻 Simulate hacking (just for fun)
          sudo      Try to become root (easter egg)
        `;
            },

            whoami: () => {
                return 'Cybersecurity Engineer | Penetration Tester';
            },

            ls: () => {
                return 'about.md  projects/  resources/  README.md';
            },

            date: () => {
                return new Date().toString();
            },

            echo: (args) => {
                if (!args) return 'Usage: echo "text"';
                return args;
            },

            clear: () => {
                output.innerHTML = '';
                return null;
            },

            matrix: () => {
                return `
        🟢 "The Matrix is everywhere. It is all around us."
        🟢 "Unfortunately, no one can be told what the Matrix is.
             You have to see it for yourself."
        `;
            },

            hack: () => {
                const lines = [
                    '🟢 Initializing hack sequence...',
                    '🟢 Bypassing firewall...',
                    '🟢 Cracking encryption...',
                    '🟢 Access granted. Welcome to the mainframe.',
                    '🟢 Congratulations! You are now a l33t h4x0r.',
                ];
                let i = 0;
                const interval = setInterval(() => {
                    if (i < lines.length) {
                        appendOutput(lines[i], 'output');
                        i++;
                        output.scrollTop = output.scrollHeight;
                    } else {
                        clearInterval(interval);
                    }
                }, 500);
                return null; // async
            },

            sudo: () => {
                return '🔴 Permission denied. (You are not in the sudoers file.)';
            },
        };

        // ── Helper to append output ──
        function appendOutput(text, className = 'output') {
            const line = document.createElement('div');
            line.innerHTML = text; // allow HTML
            line.className = className;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        // ── Execute command ──
        function executeCommand(cmd) {
            // Strip leading/trailing spaces
            cmd = cmd.trim();

            if (!cmd) {
                // Empty line – just show prompt
                return;
            }

            // Split command and args
            const parts = cmd.match(/(".*?"|[^\s]+)/g);
            const name = parts ? parts[0] : '';
            const args = parts ? parts.slice(1).join(' ') : '';

            // Show the command in output
            const promptLine = document.createElement('div');
            promptLine.innerHTML = `<span class="prompt">root@mybitbyte:~$</span> <span class="command">${escapeHtml(cmd)}</span>`;
            output.appendChild(promptLine);

            // Handle built-in commands
            let response;
            if (commands[name]) {
                response = commands[name](args);
            } else {
                response = `Command not found: ${name}. Type 'help' for available commands.`;
                appendOutput(response, 'error');
                output.scrollTop = output.scrollHeight;
                return;
            }

            // If response is null (e.g., clear, async hack), skip
            if (response !== null) {
                appendOutput(response, 'output');
            }

            output.scrollTop = output.scrollHeight;
        }

        // ── Escape HTML to prevent XSS ──
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ── Event listeners ──

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value;
                if (cmd.trim()) {
                    history.push(cmd);
                    historyIndex = history.length;
                }
                executeCommand(cmd);
                input.value = '';
                // Re-focus
                input.focus();
                e.preventDefault();
            }

            // Up arrow → history backward
            if (e.key === 'ArrowUp') {
                if (historyIndex > 0) {
                    historyIndex--;
                    input.value = history[historyIndex];
                }
                e.preventDefault();
            }

            // Down arrow → history forward
            if (e.key === 'ArrowDown') {
                if (historyIndex < history.length - 1) {
                    historyIndex++;
                    input.value = history[historyIndex];
                } else {
                    historyIndex = history.length;
                    input.value = '';
                }
                e.preventDefault();
            }
        });

        // Keep focus on the page
        document.addEventListener('click', () => {
            input.focus();
        });

        // Initial focus
        window.addEventListener('load', () => {
            input.focus();
            // Ensure cursor is at the end of the prompt (it's an input)
        });
    </script>

</body>
</html>
